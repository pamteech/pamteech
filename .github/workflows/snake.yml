name: Cobrinha de contribuições
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#39FF88&color_dots=#161B22,#3B2470,#6D28D9,#A855F7,#22D3EE
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#E9D5FF,#C084FC,#A855F7,#0891B2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
