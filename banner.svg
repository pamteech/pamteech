<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.pet{animation:idle 2.4s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-8px)}}
.eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.glow{animation:gl 6s ease-in-out infinite}@keyframes gl{50%{opacity:.25}}
.n{opacity:0;animation:cnt 6s steps(1) infinite}
.n1{animation-delay:0s}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}
@keyframes cnt{0%{opacity:1}16.66%{opacity:0}}
.n5{animation:last 6s steps(1) infinite}@keyframes last{0%,66.6%{opacity:0}66.7%,100%{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0B1E"/><stop offset="1" stop-color="#151233"/></linearGradient>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"><animate attributeName="stop-color" values="#A855F7;#C084FC;#A855F7" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#39FF88;#22D3EE" dur="5s" repeatCount="indefinite"/></stop></linearGradient>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2A2550"/></pattern>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#g)" opacity=".5"/>
<circle class="glow" cx="1050" cy="60" r="140" fill="#A855F7" opacity=".12"/>
<circle cx="980" cy="260" r="110" fill="#39FF88" opacity=".08"/>
<text x="70" y="95" font-family="JetBrains Mono,Consolas,monospace" font-size="20" fill="#39FF88">&gt; npx playwright test --project=vida_real<tspan class="cur">▌</tspan></text>
<text x="66" y="185" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" fill="url(#t)">Pam Tech</text>
<text x="70" y="235" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#E5E7EB">QA que quebra pra melhorar · IA na vida real · pets em pixel art</text>
<g font-family="JetBrains Mono,Consolas,monospace" font-size="16" fill="#8B85B8">
<text x="70" y="270">✔ </text>
<text x="92" y="270" class="n n1">3</text><text x="92" y="270" class="n n2">11</text><text x="92" y="270" class="n n3">24</text><text x="92" y="270" class="n n4">35</text><text x="92" y="270" class="n5" fill="#39FF88">42</text>
<text x="122" y="270">passed  ✖ 0 failed  ♾️ hiperfoco ativo</text></g>
<g transform="translate(930,95)"><g class="pet">
<g fill="#39FF88"><rect x="20" width="80" height="10"/><rect x="10" y="10" width="100" height="10"/><rect y="20" width="120" height="70"/><rect x="10" y="90" width="100" height="10"/></g>
<g fill="#0D0B1E"><rect class="eye" x="30" y="40" width="15" height="15"/><rect class="eye" x="75" y="40" width="15" height="15"/><rect x="45" y="70" width="30" height="8"/></g>
</g><ellipse cx="60" cy="125" rx="50" ry="6" fill="#39FF88" opacity=".15"/></g>
</svg>
